function render(){

function decodeQrFromImageFile(fileInput,venueId){
  const file=fileInput.files&&fileInput.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=(e)=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement("canvas");
      const maxDim=900;
      let w=img.width,h=img.height;
      if(w>maxDim||h>maxDim){
        if(w>h){h=Math.round((h*maxDim)/w);w=maxDim;}
        else{w=Math.round((w*maxDim)/h);h=maxDim;}
      }
      canvas.width=w;canvas.height=h;
      const ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      const imgData=ctx.getImageData(0,0,w,h);
      if(typeof jsQR==="function"){
        const decoded=jsQR(imgData.data,w,h,{inversionAttempts:"attemptBoth"});
        if(decoded&&decoded.data){
          processScannedQrCode(decoded.data,venueId);
          return;
        }
      }
      showToast("Fotoğrafta QR kod okunamadı. Kodu elle girebilirsiniz.");
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function processScannedQrCode(rawText,venueId){
  const cleaned=String(rawText||"").trim().toUpperCase().replace(/^YERIN:/,"");
  if(!cleaned){showToast("Geçerli bir QR kodu okunamadı.");return;}
  const v=state.venues.find(x=>x.id===venueId);
  const found=state.managedBookings.find(b=>doesBookingBelongToVenue(b,v)&&((b.passCode||"").toUpperCase()===cleaned||b.id.toUpperCase()===cleaned));
  const resBox=document.getElementById("qr-scan-result-box");
  if(!found){
    if(resBox){
      resBox.innerHTML=`<div style="background:#FEF2F2;border:1.5px solid var(--danger);color:var(--danger);padding:12px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;">✕ Bu işletmeye ait böyle bir rezervasyon kodu bulunamadı (${escapeHtml(cleaned)})</div>`;
    }else{
      showToast("Rezervasyon kodu bulunamadı.");
    }
    return;
  }
  if(found.status==="rejected"){
    if(resBox){
      resBox.innerHTML=`<div style="background:#FEF2F2;border:1.5px solid var(--danger);color:var(--danger);padding:12px;border-radius:12px;font-size:13px;font-weight:700;text-align:center;">⚠️ DİKKAT: Bu rezervasyon İPTAL / REDDEDİLMİŞTİR! (${escapeHtml(found.customerName)})</div>`;
    }
    return;
  }
  stopQrCamera();
  found.status="approved";
  found.checkedIn=true;
  if(found.date)boardSelectedDate=found.date;
  saveSingleBooking(found);

async function openQrScannerModal(venueId){
  stopQrCamera();
  document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-box"><div style="font-family:'Fraunces',serif;font-size:19px;font-weight:700;color:var(--brand);margin-bottom:4px;">📷 QR Rezervasyon Doğrulama</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">Müşterinin VIP Kartındaki QR kodu kameraya tutun, galeriden seçin veya kodu yazın:</div><div id="qr-video-wrap" style="position:relative;width:100%;height:230px;background:#111827;border-radius:14px;overflow:hidden;margin-bottom:10px;display:flex;align-items:center;justify-content:center;"><video id="qr-scanner-video" playsinline webkit-playsinline muted autoplay style="width:100%;height:100%;object-fit:cover;"></video><div style="position:absolute;width:160px;height:160px;border:2.5px solid #D4AF37;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,0.35);pointer-events:none;"></div></div><div id="qr-scan-result-box" style="margin-bottom:10px;"></div><div style="margin-bottom:10px;"><label class="upload-label-btn" style="width:100%;justify-content:center;padding:10px;">🖼️ Galeriden / Ekran Görüntüsünden QR Seç<input type="file" accept="image/*" style="display:none;" onchange="decodeQrFromImageFile(this, '${venueId}')" /></label></div><div style="display:flex;gap:6px;margin-bottom:10px;"><input type="text" id="manual-qr-code-input" class="form-control" placeholder="Veya kod girin (Örn: YR-742915)" onkeydown="if(event.key==='Enter') processScannedQrCode(this.value, '${venueId}');" /><button type="button" class="btn-gold btn-sm" style="width:auto;padding:0 16px;" onclick="processScannedQrCode(document.getElementById('manual-qr-code-input').value, '${venueId}')">Doğrula</button></div><button class="btn-outline" style="width:100%;" onclick="closeModal()">Kapat</button></div></div>`;

  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
      throw new Error("Kamera desteklenmiyor");
    }
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}}});
    activeQrStream=stream;
    const video=document.getElementById("qr-scanner-video");
    if(!video){stopQrCamera();return;}
    video.srcObject=stream;
    await video.play();

    const scanCanvas=document.createElement("canvas");
    const scanCtx=scanCanvas.getContext("2d",{willReadFrequently:true});
    const nativeDetector=("BarcodeDetector" in window)?new BarcodeDetector({formats:["qr_code"]}):null;

    qrScanTimer=setInterval(async()=>{
      if(!video||video.readyState<2||!video.videoWidth)return;
      try{
        if(nativeDetector){
          const codes=await nativeDetector.detect(video);
          if(codes&&codes.length>0&&codes[0].rawValue){
            processScannedQrCode(codes[0].rawValue,venueId);
            return;
          }
        }
        if(typeof jsQR==="function"){
          const vw=video.videoWidth,vh=video.videoHeight;
          const scale=Math.min(1,480/Math.max(vw,vh));
          const cw=Math.round(vw*scale),ch=Math.round(vh*scale);
          scanCanvas.width=cw;scanCanvas.height=ch;
          scanCtx.drawImage(video,0,0,cw,ch);
          const frame=scanCtx.getImageData(0,0,cw,ch);
          const decoded=jsQR(frame.data,cw,ch,{inversionAttempts:"dontInvert"});
          if(decoded&&decoded.data){
            processScannedQrCode(decoded.data,venueId);
          }
        }
      }catch(e){}
    },250);
  }catch(err){
    const wrap=document.getElementById("qr-video-wrap");
    if(wrap)wrap.innerHTML=`<div style="color:#E2E8F0;font-size:12px;text-align:center;padding:16px;">📷 Kamera izni verilmedi veya cihazda kamera bulunamadı.<br>Yukarıdan galeriden QR seçebilir veya YR kodunu yazabilirsiniz.</div>`;
  }
}

function submitWalkInBooking(venueId){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v)return;
  const flow=getVenueFlowType(v);
  const name=(document.getElementById("wi-name")?.value||"").trim();
  if(!name){showToast("Misafir adı girin.");return;}
  const phoneRaw=(document.getElementById("wi-phone")?.value||"").trim();
  const note=(document.getElementById("wi-note")?.value||"").trim();
  const timeVal=document.getElementById("wi-time")?.value||"12:00";
  const guestsVal=Math.max(1,Number(document.getElementById("wi-guests")?.value||2));
  const childrenVal=Math.max(0,Number(document.getElementById("wi-children")?.value||0));
  const areaVal=document.getElementById("wi-area")?.value||"";
  const specVal=document.getElementById("wi-spec")?.value||"";
  const srvId=document.getElementById("wi-service")?.value||(v.menuItems&&v.menuItems[0]?v.menuItems[0].id:"");
  const srvObj=(v.menuItems||[]).find(m=>m.id===srvId);
  const srvName=srvObj?srvObj.name:"Standart";
  const srvPrice=srvObj?srvObj.price:"";

  if(flow==="restaurant"||flow==="nail"){
    const curQuota=getAvailableSlotQuota(v,boardSelectedDate,timeVal,specVal);
    if(curQuota>0){
      const qKey=getSlotQuotaKey(v,boardSelectedDate,timeVal,specVal);
      v.slotQuotas=v.slotQuotas||{};
      v.slotQuotas[qKey]=curQuota-1;
      if(useFirestore&&db)db.collection("venues").doc(v.id).update({[`slotQuotas.${qKey}`]:curQuota-1}).catch(()=>{});

    if(useFirestore&&db)db.collection("venues").doc(v.id).update({[`dailySold.${key}`]:firebase.firestore.FieldValue.increment(1)}).catch(()=>{});

    if(useFirestore&&db)db.collection("venues").doc(v.id).update({[`dailyBooked.${boardSelectedDate}`]:firebase.firestore.FieldValue.increment(pax)}).catch(()=>{});
  }

  const childPart=childrenVal>0?`, ${childrenVal} Çocuk`:"";
  const notePart=note?` • Not: ${note}`:"";
  let summaryText="";
  if(flow==="restaurant"){
    summaryText=`${boardSelectedDate} • ${timeVal} • ${guestsVal} Yetişkin${childPart}${areaVal?' ('+areaVal+')':''}${notePart}`;

  }else if(flow==="beach"){
    summaryText=`${boardSelectedDate} • ${guestsVal} Yetişkin${childPart} • ${srvName}${notePart}`;
  }else{
    summaryText=`${boardSelectedDate} • ${srvName} • ${guestsVal} Yetişkin${childPart}${notePart}`;
  }

  const newBooking={
    id:"bk_wi_"+Date.now()+"_"+Math.random().toString(36).slice(2,5),
    passCode:"YR-"+Math.floor(100000+Math.random()*900000),
    venueId:v.id,
    venueName:v.name,
    category:flow,
    date:boardSelectedDate,
    time:timeVal,
    guests:guestsVal,

    totalBillAmount:0,
    payMethod:"Nakit",
    rated:false,
    rating:0,
    privateReview:"",
    createdAt:new Date().toISOString()
  };

  state.managedBookings.unshift(newBooking);
  saveSingleBooking(newBooking);

  showToast("✓ Kayıt genel tabloya eklendi");

  const dayBookings=allVenueBookings.filter(b=>b.date===boardSelectedDate&&b.status!=="rejected").sort((a,b)=>(a.time||"").localeCompare(b.time||""));
  const approvedDay=dayBookings.filter(b=>b.status==="approved");
  const pendingDay=dayBookings.filter(b=>b.status==="pending");
  const checkedInCount=dayBookings.filter(b=>b.checkedIn).length;
  let totalGuestsDay=0;
  dayBookings.forEach(b=>totalGuestsDay+=getBookingPaxCount(b));

  const timeCounts={};
  dayBookings.forEach(b=>{if(b.time)timeCounts[b.time]=(timeCounts[b.time]||0)+1;});
  const peakEntry=Object.entries(timeCounts).sort((a,b)=>b[1]-a[1])[0];
  const peakText=peakEntry?`${peakEntry[0]} (${peakEntry[1]} rez.)`:"-";

  let remainingSummary="-";
  if(flow==="boat"){
    const used=Number((v.dailyBooked&&v.dailyBooked[boardSelectedDate])||0);
    remainingSummary=`${Math.max(0,(v.capacityTotal||60)-used)} / ${v.capacityTotal||60}`;
  }else if(flow==="beach"){
    let remTotal=0;
    (v.menuItems||[]).forEach(m=>{
      const sold=Number((v.dailySold&&v.dailySold[`${boardSelectedDate}|${m.id}`])||0);
      remTotal+=Math.max(0,Number(m.stock??10)-sold);
    });
    remainingSummary=`${remTotal} Paket`;
  }else{
    const slots=v.timeSlots||[];
    let totalRem=0;
    slots.forEach(s=>{
      if(flow==="nail"){
        (v.specialists||["Standart"]).forEach(sp=>{totalRem+=getAvailableSlotQuota(v,boardSelectedDate,s,sp);});
      }else{
        totalRem+=getAvailableSlotQuota(v,boardSelectedDate,s);
      }
    });
    remainingSummary=`${totalRem} Slot`;
  }

  let boardBodyHtml="";
  if(flow==="restaurant"||flow==="nail"){
    const slots=v.timeSlots||[];
    boardBodyHtml=slots.map(slot=>{
      const slotBookings=dayBookings.filter(b=>b.time===slot);
      let remQuota=0;
      if(flow==="nail"){
        (v.specialists||["Standart"]).forEach(sp=>{remQuota+=getAvailableSlotQuota(v,boardSelectedDate,slot,sp);});
      }else{
        remQuota=getAvailableSlotQuota(v,boardSelectedDate,slot);
      }
      const bookedCount=slotBookings.length;
      const totalCap=bookedCount+remQuota;

function getScopedAccountingRows(v,allVenueBookings){
  const acc=getVenueAccountingData(v);
  const today=todayISO();
  const ym=currentYearMonth();
  const inPeriod=(d)=>{
    if(!d)return false;
    if(state.accPeriod==="today")return d===today;
    if(state.accPeriod==="month")return d.startsWith(ym);
    return true;
  };
  const rows=[];
  acc.ledger.forEach(item=>{
    if(inPeriod(item.date)){
      rows.push({id:item.id,source:"manual",type:item.type,date:item.date,amount:Number(item.amount||0),category:item.category,method:item.method||"Nakit",note:item.note||""});
    }
  });
  allVenueBookings.forEach(b=>{
    if(b.status!=="rejected"&&Number(b.paidAmount||0)>0&&inPeriod(b.date)){
      rows.push({id:b.id,source:"booking",type:"income",date:b.date,amount:Number(b.paidAmount||0),category:`Rezervasyon Tahsilatı (${b.customerName})`,method:b.payMethod||"Nakit",note:`Kod: ${b.passCode||'-'} • ${b.payStatus==='deposit'?'Kapora':'Tam Ödeme'}`});
    }
  });
  rows.sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return rows;
}

function exportAccountingCsv(venueId){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v)return;
  const myBookings=state.managedBookings.filter(b=>b.venueId===v.id);
  const rows=getScopedAccountingRows(v,myBookings);
  if(rows.length===0){showToast("Dışa aktarılacak kayıt bulunmuyor.");return;}
  const csvLines=["Tarih;Tur;Kategori;Odeme Kanali;Tutar (TL);Aciklama"];
  rows.forEach(r=>{
    const tur=r.type==="income"?"GELIR":"GIDER";
    const cleanNote=String(r.note||"").replace(/;/g,",");
    csvLines.push(`${r.date};${tur};${r.category};${r.method};${r.amount};${cleanNote}`);
  });
  const blob=new Blob(["\uFEFF"+csvLines.join("\n")],{type:"text/csv;charset=utf-8;"});
  const link=document.createElement("a");
  link.href=URL.createObjectURL(blob);
  link.download=`yerin-co-kasa-raporu-${state.accPeriod}-${todayISO()}.csv`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  showToast("Excel (CSV) Kasa Raporu indirildi!");
}

function printAccountingPdfReport(venueId){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v)return;
  const myBookings=state.managedBookings.filter(b=>b.venueId===v.id);
  const rows=getScopedAccountingRows(v,myBookings);
  let totalIn=0,totalOut=0;
  rows.forEach(r=>{if(r.type==="income")totalIn+=r.amount;else totalOut+=r.amount;});
  const netVal=totalIn-totalOut;
  const periodLabel=state.accPeriod==="today"?`Bugün (${todayISO()})`:(state.accPeriod==="month"?`Bu Ay (${currentYearMonth()})`:"Tüm Zamanlar");

function renderBusinessStatsTab(v,allVenueBookings){
  const acc=getVenueAccountingData(v);
  const rows=getScopedAccountingRows(v,allVenueBookings);
  let totalIncome=0,totalExpense=0;
  const methodTotals={};
  rows.forEach(r=>{
    if(r.type==="income"){
      totalIncome+=r.amount;
      methodTotals[r.method]=(methodTotals[r.method]||0)+r.amount;
    }else{
      totalExpense+=r.amount;
    }
  });
  const netProfit=totalIncome-totalExpense;

  // Open Cari (Receivables & Payables) + Unpaid Reservation Balances
  let openReceivables=0,openPayables=0;
  acc.cari.forEach(c=>{
    if(!c.settled){
      if(c.type==="receivable")openReceivables+=Number(c.amount||0);
      else openPayables+=Number(c.amount||0);
    }
  });
  let bookingPendingBalance=0;
  allVenueBookings.forEach(b=>{
    if(b.status!=="rejected"){
      const tot=Number(b.totalBillAmount||0),pd=Number(b.paidAmount||0);
      if(tot>pd)bookingPendingBalance+=(tot-pd);
    }
  });
  const totalReceivableAll=openReceivables+bookingPendingBalance;

  let subBodyHtml="";
  if(state.accSubTab==="ledger"){
    const methodSummaryStr=Object.entries(methodTotals).map(([m,val])=>`${m}: <strong>${val.toLocaleString("tr-TR")} TL</strong>`).join(" • ")||"Henüz tahsilat girişi yok";
    subBodyHtml=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;"><button type="button" class="btn-success btn-sm" style="flex:1;padding:10px;border-radius:10px;cursor:pointer;" onclick="openLedgerEntryModal('${v.id}', 'income')">+ Kasaya Gelir / Z Raporu Ekle</button><button type="button" class="btn-danger btn-sm" style="flex:1;padding:10px;border-radius:10px;cursor:pointer;" onclick="openLedgerEntryModal('${v.id}', 'expense')">- Kasadan Gider / Masraf Ekle</button></div><div class="panel-card" style="padding:10px 14px;font-size:12px;color:var(--text-muted);margin-bottom:12px;">💳 Tahsilat Kanalı Dağılımı: ${methodSummaryStr}</div><div class="panel-card"><div style="font-weight:700;color:var(--brand);margin-bottom:10px;">📒 Kasa Hareketleri (${rows.length} Kayıt)</div>${rows.length===0?`<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:16px 0;">Seçili dönemde henüz kasa hareketi bulunmuyor. Yukarıdan gelir veya gider ekleyebilirsiniz.</div>`:rows.map(r=>`<div class="acc-row"><div style="flex:1;min-width:190px;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span class="${r.type==='income'?'acc-pill-in':'acc-pill-out'}">${r.type==='income'?'+ GELİR':'- GİDER'}</span><strong>${escapeHtml(r.category)}</strong><span style="font-size:11px;color:var(--text-muted);">(${escapeHtml(r.method)})</span></div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${r.date}${r.note?' • '+escapeHtml(r.note):''}</div></div><div style="display:flex;align-items:center;gap:8px;"><strong style="font-size:14px;color:${r.type==='income'?'var(--success)':'var(--danger)'};">${r.type==='income'?'+':'-'}${r.amount.toLocaleString("tr-TR")} TL</strong>${r.source==='manual'?`<button type="button" class="btn-danger btn-sm" style="padding:4px 8px;border-radius:6px;cursor:pointer;" onclick="deleteLedgerEntry('${v.id}', '${r.id}')">✕</button>`:`<button type="button" class="btn-outline btn-sm" style="padding:4px 8px;font-size:11px;" onclick="openBookingPaymentModal('${r.id}')">Düzenle</button>`}</div></div>`).join("")}</div>`;
  }else if(state.accSubTab==="cari"){
    const pendingBookingsWithBal=allVenueBookings.filter(b=>b.status!=="rejected"&&Number(b.totalBillAmount||0)>Number(b.paidAmount||0));
    subBodyHtml=`<div style="margin-bottom:12px;"><button type="button" class="btn-gold btn-sm" style="width:auto;" onclick="openCariEntryModal('${v.id}')">+ Yeni Veresiye / Tedarikçi Borcu Ekle</button></div>${pendingBookingsWithBal.length>0?`<div class="panel-card"><div style="font-weight:700;color:var(--amber);margin-bottom:8px;">🎫 Rezervasyonlardan Kalan Bakiyeler (${pendingBookingsWithBal.length})</div>${pendingBookingsWithBal.map(b=>{const rem=Number(b.totalBillAmount||0)-Number(b.paidAmount||0);return`<div class="acc-row"><div><strong>${escapeHtml(b.customerName)}</strong> <span class="acc-pill-warn">Kalan: ${rem.toLocaleString("tr-TR")} TL</span><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${b.date} • Toplam: ${Number(b.totalBillAmount).toLocaleString("tr-TR")} TL • Alınan: ${Number(b.paidAmount||0).toLocaleString("tr-TR")} TL</div></div><button type="button" class="btn-success btn-sm" style="border-radius:8px;padding:6px 10px;cursor:pointer;" onclick="openBookingPaymentModal('${b.id}')">💵 Tahsil Et</button></div>`;}).join("")}</div>`:''}<div class="panel-card"><div style="font-weight:700;color:var(--brand);margin-bottom:10px;">🤝 Cari Hesaplar (Müşteri Veresiye & Tedarikçi Borçları)</div>${acc.cari.length===0?`<div style="color:var(--text-muted);font-size:13px;">Kayıtlı cari alacak veya tedarikçi borcu bulunmuyor.</div>`:acc.cari.map(c=>`<div class="acc-row" style="${c.settled?'opacity:0.6;':''}"><div style="flex:1;min-width:190px;"><div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;"><span class="${c.type==='receivable'?'acc-pill-in':'acc-pill-out'}">${c.type==='receivable'?'ALACAK (Veresiye)':'BORÇ (Tedarikçi)'}</span><strong>${escapeHtml(c.name)}</strong>${c.settled?`<span class="status-badge status-approved" style="padding:2px 7px;font-size:10px;">✓ Kapandı (${c.settledDate||''})</span>`:''}</div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">Tarih: ${c.date}${c.note?' • '+escapeHtml(c.note):''}${c.phone?' • Tel: +'+c.phone:''}</div></div><div style="display:flex;align-items:center;gap:6px;"><strong>${Number(c.amount||0).toLocaleString("tr-TR")} TL</strong>${!c.settled?`<button type="button" class="btn-success btn-sm" style="padding:5px 9px;border-radius:7px;cursor:pointer;" onclick="settleCariEntry('${v.id}', '${c.id}')">${c.type==='receivable'?'✓ Tahsil Et':'✓ Ödeme Yap'}</button>`:''}<button type="button" class="btn-danger btn-sm" style="padding:5px 8px;border-radius:7px;cursor:pointer;" onclick="deleteCariEntry('${v.id}', '${c.id}')">✕</button></div></div>`).join("")}</div>`;
  }else if(state.accSubTab==="staff"){
    const ym=currentYearMonth();
    const staffTotals={};
    acc.staff.filter(s=>(s.date||"").startsWith(ym)).forEach(s=>{staffTotals[s.name]=(staffTotals[s.name]||0)+Number(s.amount||0);});
    const summaryPills=Object.entries(staffTotals).map(([nm,tot])=>`<span class="req-tag-chip selected" style="cursor:default;">${escapeHtml(nm)}: <strong>${tot.toLocaleString("tr-TR")} TL</strong></span>`).join("");
    subBodyHtml=`<div style="margin-bottom:12px;"><button type="button" class="btn-gold btn-sm" style="width:auto;" onclick="openStaffEntryModal('${v.id}')">+ Personel Avans / Yevmiye Gir</button></div>${summaryPills?`<div class="panel-card"><div class="form-label" style="color:var(--brand);">Bu Ay (${ym}) Personel Bazlı Toplam Ödemeler</div><div class="tag-pills-wrap">${summaryPills}</div></div>`:''}<div class="panel-card"><div style="font-weight:700;color:var(--brand);margin-bottom:10px;">👷 Personel Ödeme & Avans Geçmişi (${acc.staff.length})</div>${acc.staff.length===0?`<div style="color:var(--text-muted);font-size:13px;">Henüz personel avans veya yevmiye kaydı girilmemiş.</div>`:acc.staff.map(s=>`<div class="acc-row"><div><strong>${escapeHtml(s.name)}</strong> <span class="acc-pill-warn">${escapeHtml(s.kind)}</span><div style="font-size:11px;color:var(--text-muted);margin-top:2px;">${s.date}${s.note?' • '+escapeHtml(s.note):''}</div></div><div style="display:flex;align-items:center;gap:8px;"><strong style="color:var(--danger);">-${Number(s.amount||0).toLocaleString("tr-TR")} TL</strong><button type="button" class="btn-danger btn-sm" style="padding:4px 8px;border-radius:6px;cursor:pointer;" onclick="deleteStaffEntry('${v.id}', '${s.id}')">✕</button></div></div>`).join("")}</div>`;
  }else if(state.accSubTab==="analytics"){
    const ym=currentYearMonth(),scoped=allVenueBookings.filter(b=>(b.date||"").startsWith(ym)),totalReq=scoped.length,approvedList=scoped.filter(b=>b.status==="approved"),approvedCount=approvedList.length,approvalRate=totalReq>0?Math.round((approvedCount/totalReq)*100):0;
    let totalGuests=0;const hourCounts={},serviceCounts={};
    approvedList.forEach(b=>{totalGuests+=getBookingPaxCount(b);if(b.time)hourCounts[b.time]=(hourCounts[b.time]||0)+1;if(b.serviceName)serviceCounts[b.serviceName]=(serviceCounts[b.serviceName]||0)+1;});
    const topHourEntry=Object.entries(hourCounts).sort((a,b)=>b[1]-a[1])[0],topServiceEntry=Object.entries(serviceCounts).sort((a,b)=>b[1]-a[1])[0];
    subBodyHtml=`<div class="stat-grid-2"><div class="stat-box"><div class="stat-num">${totalReq}</div><div class="stat-lbl">Bu Ay Toplam Talep</div></div><div class="stat-box"><div class="stat-num">${approvedCount} (%${approvalRate})</div><div class="stat-lbl">Onaylanan Randevu</div></div><div class="stat-box"><div class="stat-num">${totalGuests}</div><div class="stat-lbl">Ağırlanan Misafir</div></div><div class="stat-box"><div class="stat-num">${topHourEntry?topHourEntry[0]:'-'}</div><div class="stat-lbl">En Yoğun Saat</div></div></div><div class="panel-card"><div style="font-size:14px;font-weight:700;color:var(--brand);margin-bottom:10px;">📊 Tercih Özeti</div><div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;"><span style="color:var(--text-muted);">En Çok Seçilen Hizmet/Paket:</span><strong>${topServiceEntry?`${topServiceEntry[0]} (${topServiceEntry[1]})`:'-'}</strong></div></div>`;
  }

  return`<div class="cmd-toolbar"><div style="display:flex;gap:6px;flex-wrap:wrap;"><button type="button" class="pill-btn ${state.accPeriod==='today'?'active':''}" onclick="state.accPeriod='today'; render();">Bugün</button><button type="button" class="pill-btn ${state.accPeriod==='month'?'active':''}" onclick="state.accPeriod='month'; render();">Bu Ay (${currentYearMonth()})</button><button type="button" class="pill-btn ${state.accPeriod==='all'?'active':''}" onclick="state.accPeriod='all'; render();">Tüm Zamanlar</button></div><div class="cmd-actions"><button type="button" class="btn-outline btn-sm" onclick="exportAccountingCsv('${v.id}')">📊 Excel (CSV) İndir</button><button type="button" class="btn-outline btn-sm" onclick="printAccountingPdfReport('${v.id}')">🖨 Mali Müşavir PDF Raporu</button></div></div><div class="acc-summary-grid"><div class="acc-box income"><div style="font-size:11px;color:var(--text-muted);font-weight:600;">TOPLAM GELİR (TAHSİL EDİLEN)</div><div class="acc-val" style="color:var(--success);">+${totalIncome.toLocaleString("tr-TR")} TL</div></div><div class="acc-box expense"><div style="font-size:11px;color:var(--text-muted);font-weight:600;">TOPLAM GİDER & MASRAF</div><div class="acc-val" style="color:var(--danger);">-${totalExpense.toLocaleString("tr-TR")} TL</div></div><div class="acc-box net"><div style="font-size:11px;color:var(--text-muted);font-weight:600;">NET KASA DURUMU (KÂR)</div><div class="acc-val" style="color:${netProfit>=0?'var(--brand)':'var(--danger)'};">${netProfit.toLocaleString("tr-TR")} TL</div></div><div class="acc-box receivable"><div style="font-size:11px;color:var(--text-muted);font-weight:600;">AÇIK ALACAK / TEDARİKÇİ BORCU</div><div class="acc-val" style="font-size:15px;color:#B45309;">+${totalReceivableAll.toLocaleString("tr-TR")} TL / -${openPayables.toLocaleString("tr-TR")} TL</div></div></div><div class="sub-tabs"><button class="sub-tab ${state.accSubTab==='ledger'?'active':''}" onclick="state.accSubTab='ledger'; render();">📒 Kasa & Gelir-Gider Defteri</button><button class="sub-tab ${state.accSubTab==='cari'?'active':''}" onclick="state.accSubTab='cari'; render();">🤝 Cari / Veresiye & Borç (${acc.cari.filter(x=>!x.settled).length})</button><button class="sub-tab ${state.accSubTab==='staff'?'active':''}" onclick="state.accSubTab='staff'; render();">👷 Personel Avans & Yevmiye</button><button class="sub-tab ${state.accSubTab==='analytics'?'active':''}" onclick="state.accSubTab='analytics'; render();">📊 Yoğunluk Analizi</button></div>${subBodyHtml}`;
}

async function handleMenuItemPhotoUpload(venueId,idx,fileInput){const file=fileInput.files&&fileInput.files[0];if(!file)return;try{showToast("Fotoğraf optimize ediliyor...");const compressed=await compressImageFile(file,560,0.65);editMenuItem(venueId,idx,"image",compressed);render();}catch(e){showToast("Görsel yüklenemedi.");}}
async function handleNewMenuItemPhotoSelect(fileInput){const file=fileInput.files&&fileInput.files[0];if(!file)return;try{showToast("Fotoğraf hazırlandı");state.newMenuItemImgData=await compressImageFile(file,560,0.65);render();}catch(e){showToast("Görsel işlenemedi.");}}
async function handleVenueCoverUpload(venueId,fileInput){const file=fileInput.files&&fileInput.files[0];if(!file)return;try{showToast("Kapak fotoğrafı yükleniyor...");const compressed=await compressImageFile(file,640,0.68),v=state.venues.find(x=>x.id===venueId);if(v){v.image=compressed;saveSingleVenue(v);render();}}catch(e){showToast("Kapak görseli yüklenemedi.");}}
async function handleVoucherPhotoUpload(venueId,fileInput){const file=fileInput.files&&fileInput.files[0];if(!file)return;try{showToast("Voucher görseli hazırlanıyor...");const compressed=await compressImageFile(file,720,0.72),v=state.venues.find(x=>x.id===venueId);if(v){v.voucherImage=compressed;saveSingleVenue(v);showToast("VIP Voucher fotoğrafı güncellendi!");render();}}catch(e){showToast("Görsel yüklenemedi.");}}
function selectVoucherImageFromExisting(venueId,imgSrc){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.voucherImage=imgSrc;saveSingleVenue(v);showToast("Voucher kart fotoğrafı seçildi!");render();}

function saveGuestCrmNote(venueId,phoneDigits,noteText){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v||!phoneDigits)return;
  v.guestNotes=v.guestNotes||{};
  const trimmed=(noteText||"").trim();
  if(trimmed)v.guestNotes[phoneDigits]=trimmed;
  else delete v.guestNotes[phoneDigits];
  saveSingleVenue(v);
  showToast("Misafir notu kaydedildi");
}

function copyWebsiteEmbedCode(venueId,venueName){
  const directUrl=`${window.location.origin}${window.location.pathname}?mekan=${venueId}`;
  const snippet=`<a href="${directUrl}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:#0F766E;color:#FFFFFF;font-family:sans-serif;font-weight:700;font-size:14px;padding:12px 22px;border-radius:12px;text-decoration:none;box-shadow:0 4px 14px rgba(15,118,110,0.25);">📅 ${venueName} — Online Rezervasyon Yap (yerin.co)</a>`;

function addVenueCustomTimeSlot(venueId){
  const v=state.venues.find(x=>x.id===venueId);
  const input=document.getElementById("new-slot-time-input");
  const val=(input&&input.value||"").trim();
  if(!v||!val)return;
  v.timeSlots=v.timeSlots||[];
  if(!v.timeSlots.includes(val)){
    v.timeSlots.push(val);
    v.timeSlots.sort();
    saveSingleVenue(v);
    showToast("Saat eklendi: "+val);
    render();
  }else{
    showToast("Bu saat zaten listede var.");
  }
}

function removeVenueTimeSlot(venueId,slotTime){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v)return;
  v.timeSlots=(v.timeSlots||[]).filter(s=>s!==slotTime);
  saveSingleVenue(v);
  showToast("Saat kaldırıldı");
  render();
}

function toggleVenueAvailableAreaChoice(venueId,areaName){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v)return;
  v.areas=v.areas||[];
  if(v.areas.includes(areaName)){
    v.areas=v.areas.filter(a=>a!==areaName);
    v.closedAreas=(v.closedAreas||[]).filter(a=>a!==areaName);
  }else{
    v.areas.push(areaName);
  }
  saveSingleVenue(v);
  showToast(t("savedToast"));
  render();
}

function addVenueCustomArea(venueId){
  const v=state.venues.find(x=>x.id===venueId);
  const inp=document.getElementById("biz-custom-area-input");
  const val=(inp&&inp.value||"").trim();
  if(!v||!val)return;
  v.areas=v.areas||[];
  if(!v.areas.includes(val))v.areas.push(val);
  saveSingleVenue(v);
  showToast("Bölüm eklendi");
  render();
}

function toggleVenueTransferService(venueId){
  const v=state.venues.find(x=>x.id===venueId);
  if(!v)return;
  v.transferEnabled=(v.transferEnabled===false)?true:false;
  saveSingleVenue(v);
  showToast(v.transferEnabled?"Otel transfer hizmeti açıldı":"Otel transfer hizmeti kapatıldı");
  render();
}

function deleteReviewFromBooking(bookingId){
  const b=state.managedBookings.find(x=>x.id===bookingId);
  if(!b)return;
  const oldStars=Number(b.rating||0);
  const vId=b.venueId;
  b.rated=false;
  b.rating=0;
  b.privateReview="";
  saveSingleBooking(b);
  if(oldStars>0&&useFirestore&&db){
    db.collection("venues").doc(vId).update({
      ratingSum:firebase.firestore.FieldValue.increment(-oldStars),
      ratingCount:firebase.firestore.FieldValue.increment(-1)
    }).catch(()=>{});
  }
  showToast("Yorum silindi");
  render();
}

function updateBookingStatus(bookingId,status){const b=state.managedBookings.find(x=>x.id===bookingId);if(!b)return;if(status==="rejected"&&b.status!=="rejected")restoreInventoryOnCancel(b);b.status=status;saveSingleBooking(b);showToast(t("savedToast"));render();}
function bizDeleteSingleBooking(bookingId){const b=state.managedBookings.find(x=>x.id===bookingId);if(b&&b.status!=="rejected")restoreInventoryOnCancel(b);deleteBookingById(bookingId);showToast(t("savedToast"));render();}
function purgeVenuePastBookings(venueId){const toRemove=state.managedBookings.filter(b=>b.venueId===venueId&&(b.status==="rejected"||isBookingPastOrCompleted(b)));if(toRemove.length===0){showToast("Temizlenecek geçmiş kayıt yok.");return;}toRemove.forEach(b=>deleteBookingById(b.id));showToast(t("savedToast"));render();}
function toggleVenueDate(venueId,dateStr){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.closedDates=v.closedDates||[];if(v.closedDates.includes(dateStr))v.closedDates=v.closedDates.filter(d=>d!==dateStr);else v.closedDates.push(dateStr);saveSingleVenue(v);render();}
function updateDefaultSlotQuota(venueId,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.defaultSlotQuota=Math.max(0,Number(val)||0);saveSingleVenue(v);showToast(t("savedToast"));render();}
function updateVenueSpecialists(venueId,rawStr){const v=state.venues.find(x=>x.id===venueId);if(!v)return;const arr=rawStr.split(",").map(s=>s.trim()).filter(Boolean);v.specialists=arr.length>0?arr:["Standart"];panelSelectedSpecialist=v.specialists[0];saveSingleVenue(v);showToast(t("savedToast"));render();}
function setVenueSlotQuota(venueId,dateStr,slotTime,specialist,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;const qKey=getSlotQuotaKey(v,dateStr,slotTime,specialist);v.slotQuotas=v.slotQuotas||{};v.slotQuotas[qKey]=Math.max(0,Number(val)||0);saveSingleVenue(v);showToast(t("savedToast"));render();}
function toggleVenueArea(venueId,area){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.closedAreas=v.closedAreas||[];if(v.closedAreas.includes(area))v.closedAreas=v.closedAreas.filter(a=>a!==area);else v.closedAreas.push(area);saveSingleVenue(v);render();}
function updateBeachStock(venueId,idx,val){const v=state.venues.find(x=>x.id===venueId);if(!v||!v.menuItems[idx])return;v.menuItems[idx].stock=Math.max(0,Number(val));saveSingleVenue(v);showToast(t("savedToast"));}
function updateBoatCap(venueId,field,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;if(field==="total")v.capacityTotal=Number(val);saveSingleVenue(v);showToast(t("savedToast"));}
function updateBoatDateBooked(venueId,dateStr,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.dailyBooked=v.dailyBooked||{};v.dailyBooked[dateStr]=Math.max(0,Number(val));saveSingleVenue(v);showToast(t("savedToast"));}

    const flowNames={nail:"Saat + Uzman/Saha/Birim (Berber, Halı Saha, Bakım)",restaurant:"Saat + Masa/Bölüm + Kişi Sayısı (Restoran, Kafe)",beach:"Günlük Paket / Kontenjan (Beach Club, Loca, Etkinlik)",boat:"Toplam Kapasite + Transfer (Tekne, Tur)"};
    content=`<div class="detail-layout-grid"><div class="panel-card"><div style="font-weight:700;color:var(--brand);margin-bottom:10px;">+ Yeni Kategori Oluştur</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.45;">Buradan eklediğiniz kategori işletme ekleme listesine gelir. İçinde aktif en az 1 işletme olduğunda ana vitrinde otomatik görünür.</div><div style="display:flex;gap:8px;" class="form-group"><input type="text" id="adm-cat-icon" class="form-control" style="width:72px;text-align:center;font-size:18px;" value="⚽" placeholder="İkon" /><input type="text" id="adm-cat-name" class="form-control" placeholder="Kategori Adı (Örn: Halı Saha, Berber)" /></div><div class="form-group"><label class="form-label">Rezervasyon Akış Tipi</label><select id="adm-cat-flow" class="form-control"><option value="nail">Saat + Uzman / Saha / Birim (Berber, Halı Saha, Bakım)</option><option value="restaurant">Saat + Masa / Bölüm + Kişi (Restoran, Kafe)</option><option value="beach">Günlük Paket / Kontenjan (Beach Club, Loca)</option><option value="boat">Toplam Kapasite + Transfer (Tekne, Tur)</option></select></div><button class="btn-gold" onclick="adminAddCategory()">+ Kategoriyi Ekle</button></div><div><div class="form-label" style="margin-bottom:10px;">Tanımlı Kategoriler (${cats.length})</div>${cats.map(c=>{const count=state.venues.filter(v=>v.category===c.id&&v.active!==false).length;return`<div class="panel-card" style="display:flex;justify-content:space-between;align-items:center;gap:10px;"><div><div style="font-weight:700;font-size:15px;">${c.icon||'📌'} ${c.name} <span style="font-size:11px;color:${count>0?'var(--success)':'var(--text-muted)'};">(${count} aktif işletme — ${count>0?'Vitrinde Görünür':'Gizli'})</span></div><div style="font-size:11px;color:var(--text-muted);margin-top:3px;">${flowNames[c.flowType]||c.flowType}</div></div><button class="btn-danger btn-sm" style="border-radius:8px;padding:7px 10px;cursor:pointer;" onclick="adminRemoveCategory('${c.id}')">🗑</button></div>`;}).join("")}</div></div>`;
  }else if(state.adminTab==="areas"){
    content=`<div class="detail-layout-grid"><div class="panel-card"><div style="font-weight:700;color:var(--brand);margin-bottom:10px;">+ Yeni Mekan Bölümü Ekle</div><div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;line-height:1.45;">Buradan eklediğiniz tüm bölüm seçenekleri (Teras, Loca, Sigara İçilen Alan vb.) işletmelerin kendi panellerine gider; işletmeler kendi mekanlarına uygun olanları işaretleyip aktif eder.</div><div class="form-group"><input type="text" id="adm-area-name" class="form-control" placeholder="Bölüm Adı (Örn: Şömine Başı, Çocuk Oyun Alanı Yanı)" /></div><button class="btn-gold" onclick="adminAddAreaOption()">+ Bölümü Havuza Ekle</button></div><div><div class="form-label" style="margin-bottom:10px;">Tanımlı Bölüm Seçenekleri (${areasList.length})</div><div class="panel-card"><div class="tag-pills-wrap">${areasList.map(a=>`<div style="display:inline-flex;align-items:center;gap:6px;background:var(--bg-elevated);border:1px solid var(--border-subtle);padding:7px 12px;border-radius:18px;font-size:13px;font-weight:600;"><span>${a}</span><span style="color:var(--danger);cursor:pointer;font-weight:700;" onclick="adminRemoveAreaOption('${a.replace(/'/g,"")}')">✕</span></div>`).join("")}</div></div></div></div>`;
  }else if(state.adminTab==="allBookings"){
    const targetFilterVenue=state.adminVenueFilter==="all"?null:state.venues.find(vn=>vn.id===state.adminVenueFilter);
    const filteredBookings=state.adminVenueFilter==="all"?state.managedBookings:state.managedBookings.filter(b=>targetFilterVenue?doesBookingBelongToVenue(b,targetFilterVenue):(b.venueId===state.adminVenueFilter));
    content=`<div class="cmd-toolbar"><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;"><span style="font-size:12px;font-weight:700;color:var(--brand);">İşletme Filtresi:</span><select class="form-control" style="width:auto;padding:7px 12px;font-size:13px;" onchange="state.adminVenueFilter=this.value; render();"><option value="all" ${state.adminVenueFilter==='all'?'selected':''}>Tüm İşletmeler (${state.managedBookings.length})</option>${state.venues.map(vn=>`<option value="${vn.id}" ${state.adminVenueFilter===vn.id?'selected':''}>${escapeHtml(vn.name)} (${state.managedBookings.filter(x=>doesBookingBelongToVenue(x,vn)).length})</option>`).join("")}</select></div><button class="btn-danger btn-sm" style="border-radius:8px;padding:7px 12px;cursor:pointer;" onclick="adminPurgeAllPast()">🗑 ${t("deletePast")}</button></div>${filteredBookings.length===0?`<div class="panel-card" style="text-align:center;color:var(--text-muted);">${t("noBookings")}</div>`:`<div class="cards-grid-responsive">${filteredBookings.map(b=>`<div class="panel-card" style="margin-bottom:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px;"><div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:11px;font-weight:700;color:var(--brand);">${escapeHtml(b.venueName)}</span><span class="status-badge ${b.status==='approved'?'status-approved':b.status==='rejected'?'status-rejected':'status-pending'}">${b.status==='approved'?t("statusApproved"):b.status==='rejected'?t("statusRejected"):t("statusPending")}</span></div><div style="font-weight:700;font-size:14px;">${escapeHtml(b.customerName)} <span style="font-family:monospace;font-size:11px;color:var(--text-muted);">(${b.passCode||'-'})</span></div><div style="font-size:12px;color:var(--text-muted);margin-top:3px;">${escapeHtml(b.summary)}</div></div><div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--border-subtle);">${b.status!=='approved'?`<button class="btn-success btn-sm" style="border-radius:8px;padding:6px 10px;cursor:pointer;" onclick="updateBookingStatus('${b.id}', 'approved')">✓ Onayla</button>`:''}<button class="btn-outline btn-sm" style="flex:1;border-radius:8px;padding:6px 10px;cursor:pointer;" onclick="openAdminEditBookingModal('${b.id}')">✏️ Düzenle</button><button class="btn-danger btn-sm" style="border-radius:8px;padding:6px 10px;cursor:pointer;" onclick="bizDeleteSingleBooking('${b.id}')">🗑</button></div></div>`).join("")}</div>`}`;
  }
  return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><div><div style="font-size:11px;color:var(--brand);font-weight:700;">SİSTEM YÖNETİMİ</div><div style="font-size:20px;font-weight:700;">yerin.co Kontrol Merkezi</div></div><button class="btn-outline btn-sm" onclick="logoutAuth()">${t("logout")}</button></div><div class="stat-grid"><div class="stat-box"><div class="stat-num">${activeCount}</div><div class="stat-lbl">Aktif İşletme</div></div><div class="stat-box"><div class="stat-num">${totalBookings}</div><div class="stat-lbl">Toplam Talep</div></div><div class="stat-box"><div class="stat-num">${approvedBookings}</div><div class="stat-lbl">Onaylı</div></div></div><div class="sub-tabs"><button class="sub-tab ${state.adminTab==='venues'?'active':''}" onclick="state.adminTab='venues'; render();">İşletme & Abonelik</button><button class="sub-tab ${state.adminTab==='categories'?'active':''}" onclick="state.adminTab='categories'; render();">Kategoriler (${cats.length})</button><button class="sub-tab ${state.adminTab==='areas'?'active':''}" onclick="state.adminTab='areas'; render();">Bölümler (${areasList.length})</button><button class="sub-tab ${state.adminTab==='allBookings'?'active':''}" onclick="state.adminTab='allBookings'; render();">Tüm Talepler & Düzenleme (${totalBookings})</button></div>${content}`;
}

function openAdminEditModal(venueId){const v=state.venues.find(x=>x.id===venueId);if(!v)return;const cats=state.categories||DEFAULT_CATEGORIES;state.admEditVenueImgData="";const displayRevUrl=(v.googleReviewsUrl&&!v.googleReviewsUrl.includes("google.com/search?q="))?v.googleReviewsUrl:"";document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-box"><div style="font-size:17px;font-weight:700;color:var(--brand);margin-bottom:12px;">İşletme Düzenle: ${v.name}</div><div class="form-group"><label class="form-label">İşletme Adı</label><input type="text" id="edit-adm-name" class="form-control" value="${v.name}" /></div><div class="form-group"><label class="form-label">Kategori</label><select id="edit-adm-cat" class="form-control">${cats.map(c=>`<option value="${c.id}" ${v.category===c.id?'selected':''}>${c.icon||'📌'} ${c.name}</option>`).join("")}</select></div><div class="option-grid form-group"><div><label class="form-label">Şehir</label><select id="edit-adm-city" class="form-control">${TURKEY_CITIES.slice(1).map(c=>`<option value="${c}" ${(v.city||'Antalya')===c?'selected':''}>${c}</option>`).join("")}</select></div><div><label class="form-label">İlçe / Semt</label><input type="text" id="edit-adm-dist" class="form-control" value="${v.district||''}" /></div></div><div class="form-group"><label class="form-label">Yetkili İşletme E-postası</label><input type="email" id="edit-adm-email" class="form-control" value="${v.ownerEmail||''}" /></div><div class="form-group"><label class="form-label">WhatsApp Numarası</label><input type="text" id="edit-adm-wa" class="form-control" value="${v.whatsapp}" /></div><div class="option-grid form-group"><div><label class="form-label">Web Sitesi Linki</label><input type="url" id="edit-adm-web" class="form-control" value="${v.websiteUrl||''}" /></div><div><label class="form-label">Instagram Linki</label><input type="url" id="edit-adm-ig" class="form-control" value="${v.instagramUrl||''}" /></div></div><div class="option-grid form-group"><div><label class="form-label">Google Haritalar Linki</label><input type="url" id="edit-adm-map" class="form-control" value="${v.googleMapUrl||''}" /></div><div><label class="form-label">Google Yorumlar Linki</label><input type="url" id="edit-adm-rev" class="form-control" value="${displayRevUrl}" /></div></div><div class="form-group"><label class="form-label">Kapak Görseli</label><div style="margin-bottom:6px;"><label class="upload-label-btn">📷 Galeriden Kapak Seç<input type="file" accept="image/*" style="display:none;" onchange="handleAdminEditVenuePhoto(this)" /></label></div><input type="url" id="edit-adm-img" class="form-control" value="${v.image.startsWith('data:')?'':v.image}" placeholder="Veya URL girin" /></div><div class="form-group"><label class="form-label">Açıklama</label><textarea id="edit-adm-desc" rows="2" class="form-control">${v.description}</textarea></div><div style="display:flex;gap:8px;"><button class="btn-outline" style="flex:1;" onclick="closeModal()">Vazgeç</button><button class="btn-gold" style="flex:2;" onclick="saveAdminVenueEdit('${v.id}')">Kaydet</button></div></div></div>`;}
function saveAdminVenueEdit(venueId){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.name=document.getElementById("edit-adm-name").value.trim()||v.name;v.category=document.getElementById("edit-adm-cat").value||v.category;v.city=document.getElementById("edit-adm-city").value;v.district=document.getElementById("edit-adm-dist").value.trim();v.ownerEmail=document.getElementById("edit-adm-email").value.trim().toLowerCase();v.whatsapp=formatWhatsAppNumber(document.getElementById("edit-adm-wa").value)||"905380942797";v.websiteUrl=normalizeExternalUrl(document.getElementById("edit-adm-web").value);v.instagramUrl=normalizeExternalUrl(document.getElementById("edit-adm-ig").value);v.googleMapUrl=normalizeExternalUrl(document.getElementById("edit-adm-map").value);v.googleReviewsUrl=normalizeExternalUrl(document.getElementById("edit-adm-rev").value);const urlImg=document.getElementById("edit-adm-img").value.trim();if(state.admEditVenueImgData)v.image=state.admEditVenueImgData;else if(urlImg)v.image=urlImg;v.description=document.getElementById("edit-adm-desc").value.trim();saveSingleVenue(v);closeModal();showToast(t("savedToast"));render();}
function adminToggleFeatured(id){const v=state.venues.find(x=>x.id===id);if(!v)return;v.featured=!v.featured;saveSingleVenue(v);showToast(t("savedToast"));render();}
function adminToggleVenueActive(id){const v=state.venues.find(x=>x.id===id);if(!v)return;v.active=v.active===false?true:false;saveSingleVenue(v);showToast(t("savedToast"));render();}

async function adminCreateVenue(){
  const name=document.getElementById("adm-v-name").value.trim();
  const ownerEmail=document.getElementById("adm-v-email").value.trim().toLowerCase();
  const ownerPass=(document.getElementById("adm-v-pass")?.value||"").trim();
  const city=document.getElementById("adm-v-city").value;
  const district=document.getElementById("adm-v-dist").value.trim();
  const category=document.getElementById("adm-v-cat").value;
  const whatsapp=formatWhatsAppNumber(document.getElementById("adm-v-wa").value)||"905380942797";
  const websiteUrl=normalizeExternalUrl(document.getElementById("adm-v-web")?.value||"");
  const instagramUrl=normalizeExternalUrl(document.getElementById("adm-v-ig").value);
  const customImg=document.getElementById("adm-v-img").value.trim();
  const googleMapUrl=normalizeExternalUrl(document.getElementById("adm-v-map").value);
  const googleReviewsUrl=normalizeExternalUrl(document.getElementById("adm-v-rev")?.value||"");
  const description=document.getElementById("adm-v-desc").value.trim()||"Hızlı ve kolay online randevu ve rezervasyon.";
  if(!name){showToast("Lütfen işletme adı girin.");return;}
  if(ownerEmail&&ownerPass&&ownerPass.length<6){showToast("Şifre en az 6 karakter olmalıdır.");return;}

  let authNote="";
  if(ownerEmail&&ownerPass){
    state.creatingBizAuth=true;
    render();
    const res=await createBusinessAuthUserSilently(ownerEmail,ownerPass);
    state.creatingBizAuth=false;
    if(!res.ok){
      render();
      showToast("Hesap hatası: "+res.msg);
      return;
    }
    authNote=res.created?" • Giriş hesabı otomatik açıldı!":" • Mevcut e-posta hesabına bağlandı!";
  }

  const catMeta=getCategoryMeta(category),flow=catMeta.flowType||"nail";
  const defaultImages={restaurant:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80",nail:"https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=900&q=80",beach:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",boat:"https://images.unsplash.com/photo-1567899378494-47b22a2ae96a?auto=format&fit=crop&w=900&q=80"},finalCover=state.admNewVenueImgData||customImg||defaultImages[flow]||defaultImages.nail;
  state.admNewVenueImgData="";
  const halfHourSlotsNail=["10:00","10:30","11:00","11:30","12:00","12:30","13:00","13:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30","18:00","18:30","19:00","19:30","20:00"];
  const halfHourSlotsRest=["17:00","17:30","18:00","18:30","19:00","19:30","20:00","20:30","21:00","21:30","22:00","22:30","23:00"];
  const newVenue={id:"v_"+Date.now(),name,ownerEmail,category,city,district,whatsapp,websiteUrl,instagramUrl,active:true,featured:false,transferEnabled:true,image:finalCover,voucherImage:"",bookingRule:"",guestNotes:{},accounting:{ledger:[],cari:[],staff:[]},description,googleMapUrl,googleReviewsUrl,ratingSum:5.0,ratingCount:1,defaultSlotQuota:flow==="nail"?1:5,slotQuotas:{},closedDates:[],closedAreas:[],dailySold:{},dailyBooked:{},timeSlots:flow==="nail"?halfHourSlotsNail:halfHourSlotsRest,areas:["Teras","İç Mekan","Açık Bahçe"],specialists:["1. Birim / Uzman","2. Birim / Uzman","Fark Etmez"],capacityTotal:50,menuItems:[{id:"m_"+Date.now(),name:"Standart Rezervasyon / Hizmet",price:"750 TL",stock:20,image:""}]};
  saveSingleVenue(newVenue);
  showToast(t("savedToast")+authNote);
  render();
}
function adminDeleteVenue(id){state.venues=state.venues.filter(v=>v.id!==id);localStorage.setItem(STORAGE_KEY_VENUES,JSON.stringify(state.venues));if(useFirestore&&db)db.collection("venues").doc(id).delete();state.managedBookings.filter(b=>b.venueId===id).forEach(b=>deleteBookingById(b.id));showToast(t("savedToast"));render();}
function adminPurgeAllPast(){const toRemove=state.managedBookings.filter(b=>b.status==="rejected"||b.rated||isBookingPastOrCompleted(b));if(toRemove.length===0){showToast("Silinecek geçmiş rezervasyon bulunamadı.");return;}toRemove.forEach(b=>deleteBookingById(b.id));showToast(`${toRemove.length} geçmiş kayıt silindi.`);render();}

loadInitialData();render();
</script>
