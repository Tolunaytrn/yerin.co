function renderBusinessStatsTab(v,allVenueBookings){const ym=currentYearMonth(),scoped=state.statsPeriod==="month"?allVenueBookings.filter(b=>(b.date||"").startsWith(ym)):allVenueBookings,totalReq=scoped.length,approvedList=scoped.filter(b=>b.status==="approved"),approvedCount=approvedList.length,approvalRate=totalReq>0?Math.round((approvedCount/totalReq)*100):0;let totalGuests=0,estRevenueTL=0,estRevenueEUR=0;const hourCounts={},serviceCounts={};approvedList.forEach(b=>{if(b.category==="boat")totalGuests+=Number(b.adults||1)+Number(b.children||0);else if(b.category==="nail")totalGuests+=1;else totalGuests+=Number(b.guests||1)+Number(b.children||0);if(b.time)hourCounts[b.time]=(hourCounts[b.time]||0)+1;if(b.serviceName)serviceCounts[b.serviceName]=(serviceCounts[b.serviceName]||0)+1;const unitPrice=extractNumericPrice(b.servicePrice);if(unitPrice>0){const isEuro=String(b.servicePrice||"").includes("€"),isPerPerson=String(b.servicePrice||"").toLowerCase().includes("kişi"),multiplier=isPerPerson?Math.max(1,Number(b.guests||1)):(b.category==="boat"?(Number(b.adults||1)+Number(b.children||0)):1);if(isEuro)estRevenueEUR+=unitPrice*multiplier;else estRevenueTL+=unitPrice*multiplier;}});const topHourEntry=Object.entries(hourCounts).sort((a,b)=>b[1]-a[1])[0],topServiceEntry=Object.entries(serviceCounts).sort((a,b)=>b[1]-a[1])[0],revenueDisplay=[];if(estRevenueTL>0)revenueDisplay.push(`${estRevenueTL.toLocaleString("tr-TR")} TL`);if(estRevenueEUR>0)revenueDisplay.push(`${estRevenueEUR.toLocaleString("tr-TR")} €`);const finalRevStr=revenueDisplay.length>0?revenueDisplay.join(" + "):"0 TL";return`<div style="display:flex;gap:8px;margin-bottom:14px;"><button class="pill-btn ${state.statsPeriod==='month'?'active':''}" style="flex:1;" onclick="state.statsPeriod='month'; render();">Bu Ay (${ym})</button><button class="pill-btn ${state.statsPeriod==='all'?'active':''}" style="flex:1;" onclick="state.statsPeriod='all'; render();">Tüm Zamanlar</button></div><div class="stat-grid-2">< function copyTextToClipboard(text){if(navigator.clipboard){navigator.clipboard.writeText(text);showToast("Özel link kopyalandı!");}}
function updateBookingStatus(bookingId,status){const b=state.managedBookings.find(x=>x.id===bookingId);if(!b)return;if(status==="rejected"&&b.status!=="rejected")restoreInventoryOnCancel(b);b.status=status;saveSingleBooking(b);showToast(t("savedToast"));render();}
function bizDeleteSingleBooking(bookingId){const b=state.managedBookings.find(x=>x.id===bookingId);if(b&&b.status!=="rejected")restoreInventoryOnCancel(b);deleteBookingById(bookingId);showToast(t("savedToast"));render();}
function purgeVenuePastBookings(venueId){const toRemove=state.managedBookings.filter(b=>b.venueId===venueId&&(b.status==="rejected"||isBookingPastOrCompleted(b)));if(toRemove.length===0){showToast("Temizlenecek geçmiş kayıt yok.");return;}toRemove.forEach(b=>deleteBookingById(b.id));showToast(t("savedToast"));render();}
function toggleVenueDate(venueId,dateStr){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.closedDates=v.closedDates||[];if(v.closedDates.includes(dateStr))v.closedDates=v.closedDates.filter(d=>d!==dateStr);else v.closedDates.push(dateStr);saveSingleVenue(v);render();}
function updateDefaultSlotQuota(venueId,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.defaultSlotQuota=Math.max(0,Number(val)||0);saveSingleVenue(v);showToast(t("savedToast"));render();}
function setVenueSlotQuota(venueId,dateStr,slotTime,specialist,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;const qKey=getSlotQuotaKey(v,dateStr,slotTime,specialist);v.slotQuotas=v.slotQuotas||{};v.slotQuotas[qKey]=Math.max(0,Number(val)||0);saveSingleVenue(v);showToast(t("savedToast"));render();}
function toggleVenueArea(venueId,area){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.closedAreas=v.closedAreas||[];if(v.closedAreas.includes(area))v.closedAreas=v.closedAreas.filter(a=>a!==area);else v.closedAreas.push(area);saveSingleVenue(v);render();}
function updateBeachStock(venueId,idx,val){const v=state.venues.find(x=>x.id===venueId);if(!v||!v.menuItems[idx])return;v.menuItems[idx].stock=Math.max(0,Number(val));saveSingleVenue(v);showToast(t("savedToast"));}
function updateBoatCap(venueId,field,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;if(field==="total")v.capacityTotal=Number(val);saveSingleVenue(v);showToast(t("savedToast"));}
function updateBoatDateBooked(venueId,dateStr,val){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.dailyBooked=v.dailyBooked||{};v.dailyBooked[dateStr]=Math.max(0,Number(val));saveSingleVenue(v);showToast(t("savedToast"));}
function editMenuItem(venueId,idx,key,val){const v=state.venues.find(x=>x.id===venueId);if(!v||!v.menuItems[idx])return;v.menuItems[idx][key]=val;saveSingleVenue(v);showToast(t("savedToast"));}
function removeMenuItem(venueId,idx){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.menuItems.splice(idx,1);saveSingleVenue(v);render();}
function addMenuItem(venueId){const v=state.venues.find(x=>x.id===venueId),name=document.getElementById("new-item-name").value.trim(),price=document.getElementById("new-item-price").value.trim();if(!v||!name||!price)return;v.menuItems.push({id:"item_"+Date.now(),name,price,stock:10,image:state.newMenuItemImgData||""});state.newMenuItemImgData="";saveSingleVenue(v);showToast(t("savedToast"));render();}
function saveVenueSettings(venueId){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.name=document.getElementById("set-v-name").value.trim()||v.name;v.city=document.getElementById("set-v-city").value;v.district=document.getElementById("set-v-dist").value.trim();v.whatsapp=formatWhatsAppNumber(document.getElementById("set-v-wa").value)||"905380942797";v.instagramUrl=document.getElementById("set-v-ig").value.trim();const urlVal=document.getElementById("set-v-img").value.trim();if(urlVal)v.image=urlVal;v.googleMapUrl=document.getElementById("set-v-map").value.trim();v.googleReviewsUrl=document.getElementById("set-v-rev").value.trim();v.description=document.getElementById("set-v-desc").value.trim();saveSingleVenue(v);showToast(t("savedToast"));render();}

async function handleAdminNewVenuePhoto(fileInput){const file=fileInput.files&&fileInput.files[0];if(!file)return;try{state.admNewVenueImgData=await compressImageFile(file,800,0.75);showToast("Kapak fotoğrafı seçildi");render();}catch(e){}}
async function handleAdminEditVenuePhoto(fileInput){const file=fileInput.files&&fileInput.files[0];if(!file)return;try{state.admEditVenueImgData=await compressImageFile(file,800,0.75);showToast("Yeni kapak fotoğrafı hazır");}catch(e){}}

function renderAdminPanel(){if(!state.isAdminLogged)return renderBusinessLoginGate();const activeCount=state.venues.filter(v=>v.active!==false).length,totalBookings=state.managedBookings.length,approvedBookings=state.managedBookings.filter(b=>b.status==="approved").length;let content="";if(state.adminTab==="venues"){content=`<div class="panel-card"><div style="font-weight:700;color:var(--brand);margin-bottom:10px;">${t("addNewVenue")}</div><div class="form-group"><input type="text" id="adm-v-name" class="form-control" placeholder="Mekan Adı" /></div><div class="form-group"><input type="email" id="adm-v-email" class="form-control" placeholder="İşletme Yetkili E-postası (Örn: mekan@yerin.co)" /></div><div class="option-grid form-group"><select id="adm-v-city" class="form-control">${TURKEY_CITIES.slice(1).map(c=>`<option value="${c}">${c}</option>`).join("")}</select><input type="text" id="adm-v-dist" class="form-control" placeholder="İlçe / Semt (Örn: Bodrum, Bebek)" /></div><div class="form-group"><select id="adm-v-cat" class="form-control"><option value="restaurant">Restoran</option><option value="nail">Tırnak & Bakım Stüdyosu</option><option value="beach">Beach Club</option><option value="boat">Tekne Turu</option></select></div><div class="form-group"><input type="text" id="adm-v-wa" class="form-control" value="905380942797" placeholder="WhatsApp Numarası" /></div><div class="form-group"><input type="url" id="adm-v-ig" class="form-control" placeholder="Instagram Linki (Opsiyonel)" /></div><div class="form-group" style="display:flex;gap:8px;align-items:center;"><label class="upload-label-btn">📷 ${state.admNewVenueImgData?'✓ Kapak Seçildi':'Galeriden Kapak Seç'}<input type="file" accept="image/*" style="display:none;" onchange="handleAdminNewVenuePhoto(this)" /></label><input type="url" id="adm-v-img" class="form-control" placeholder="Veya Kapak URL" /></div><div class="form-group"><input type="url" id="adm-v-map" class="form-control" placeholder="Google Haritalar Adres Linki (Opsiyonel)" /></div><div class="form-group"><input type="text" id="adm-v-desc" class="form-control" placeholder="Kısa Açıklama" /></div><button class="btn-gold" onclick="adminCreateVenue()">${t("addNewVenue")}</button></div><div class="form-label" style="margin-top:14px;">Kayıtlı Mekanlar (${state.venues.length})</div>${state.venues.map(v=>{const isActive=v.active!==false,isFeat=Boolean(v.featured);return`<div class="panel-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><div style="font-weight:700;">${isFeat?'★ ':''}${v.name}</div><div style="font-size:12px;color:var(--text-muted);">${v.city||'Antalya'} / ${v.district||'-'} • ${v.ownerEmail||'E-posta tanımlı değil'}</div></div><span class="status-badge ${isActive?'status-approved':'status-rejected'}">${isActive?'Aktif':'Askıda'}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;"><button class="btn-outline btn-sm" style="flex:1;border-radius:8px;padding:7px;cursor:pointer;" onclick="openAdminEditModal('${v.id}')">✏️ Düzenle</button><button class="btn-outline btn-sm" style="flex:1;border-radius:8px;padding:7px;cursor:pointer;" onclick="adminToggleFeatured('${v.id}')">${isFeat?'Vitrinden Al':'★ Öne Çıkar'}</button><button class="${isActive?'btn-outline':'btn-success'} btn-sm" style="border-radius:8px;padding:7px 10px;cursor:pointer;" onclick="adminToggleVenueActive('${v.id}')">${isActive?'⏸':'▶'}</button><button class="btn-danger btn-sm" style="border-radius:8px;padding:7px 10px;cursor:pointer;" onclick="adminDeleteVenue('${v.id}')">🗑</button></div></div>`;}).join("")}`;}else if(state.adminTab==="allBookings"){content=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><span style="font-size:12px;color:var(--text-muted);">Toplam Kayıt: ${state.managedBookings.length}</span><button class="btn-danger btn-sm" style="border-radius:8px;padding:7px 12px;cursor:pointer;" onclick="adminPurgeAllPast()">🗑 ${t("deletePast")}</button></div>${state.managedBookings.length===0?`<div class="panel-card" style="text-align:center;color:var(--text-muted);">${t("noBookings")}</div>`:''}${state.managedBookings.map(b=>`<div class="panel-card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><div><div style="font-weight:700;font-size:14px;">${b.venueName} — ${b.customerName}</div><div style="font-size:12px;color:var(--text-muted);">${b.summary}</div></div><button class="btn-danger btn-sm" style="border-radius:8px;padding:7px 10px;cursor:pointer;" onclick="bizDeleteSingleBooking('${b.id}')">🗑</button></div>`).join("")}`;}return`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;"><div><div style="font-size:11px;color:var(--brand);font-weight:700;">SİSTEM YÖNETİMİ</div><div style="font-size:18px;font-weight:700;">yerin.co Kontrol Merkezi</div></div><button class="btn-outline btn-sm" onclick="logoutAuth()">${t("logout")}</button></div><div class="stat-grid"><div class="stat-box"><div class="stat-num">${activeCount}</div><div class="stat-lbl">Aktif Mekan</div></div><div class="stat-box"><div class="stat-num">${totalBookings}</div><div class="stat-lbl">Toplam Talep</div></div><div class="stat-box"><div class="stat-num">${approvedBookings}</div><div class="stat-lbl">Onaylı</div></div></div><div class="sub-tabs"><button class="sub-tab ${state.adminTab==='venues'?'active':''}" onclick="state.adminTab='venues'; render();">Mekan & Abonelik</button><button class="sub-tab ${state.adminTab==='allBookings'?'active':''}" onclick="state.adminTab='allBookings'; render();">Tüm Talepler & Temizlik</button></div>${content}`;}

function openAdminEditModal(venueId){const v=state.venues.find(x=>x.id===venueId);if(!v)return;state.admEditVenueImgData="";document.getElementById("modal-root").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this) closeModal()"><div class="modal-box"><div style="font-size:17px;font-weight:700;color:var(--brand);margin-bottom:12px;">Mekan Düzenle: ${v.name}</div><div class="form-group"><label class="form-label">Mekan Adı</label><input type="text" id="edit-adm-name" class="form-control" value="${v.name}" /></div><div class="option-grid form-group"><div><label class="form-label">Şehir</label><select id="edit-adm-city" class="form-control">${TURKEY_CITIES.slice(1).map(c=>`<option value="${c}" ${(v.city||'Antalya')===c?'selected':''}>${c}</option>`).join("")}</select></div><div><label class="form-label">İlçe / Semt</label><input type="text" id="edit-adm-dist" class="form-control" value="${v.district||''}" /></div></div><div class="form-group"><label class="form-label">Yetkili İşletme E-postası</label><input type="email" id="edit-adm-email" class="form-control" value="${v.ownerEmail||''}" /></div><div class="form-group"><label class="form-label">WhatsApp Numarası</label><input type="text" id="edit-adm-wa" class="form-control" value="${v.whatsapp}" /></div><div class="form-group"><label class="form-label">Instagram Linki</label><input type="url" id="edit-adm-ig" class="form-control" value="${v.instagramUrl||''}" /></div><div class="form-group"><label class="form-label">Kapak Görseli</label><div style="margin-bottom:6px;"><label class="upload-label-btn">📷 Galeriden Kapak Seç<input type="file" accept="image/*" style="display:none;" onchange="handleAdminEditVenuePhoto(this)" /></label></div><input type="url" id="edit-adm-img" class="form-control" value="${v.image.startsWith('data:')?'':v.image}" placeholder="Veya URL girin" /></div><div class="form-group"><label class="form-label">Açıklama</label><textarea id="edit-adm-desc" rows="2" class="form-control">${v.description}</textarea></div><div style="display:flex;gap:8px;"><button class="btn-outline" style="flex:1;" onclick="closeModal()">Vazgeç</button><button class="btn-gold" style="flex:2;" onclick="saveAdminVenueEdit('${v.id}')">Kaydet</button></div></div></div>`;}
function saveAdminVenueEdit(venueId){const v=state.venues.find(x=>x.id===venueId);if(!v)return;v.name=document.getElementById("edit-adm-name").value.trim()||v.name;v.city=document.getElementById("edit-adm-city").value;v.district=document.getElementById("edit-adm-dist").value.trim();v.ownerEmail=document.getElementById("edit-adm-email").value.trim().toLowerCase();v.whatsapp=formatWhatsAppNumber(document.getElementById("edit-adm-wa").value)||"905380942797";v.instagramUrl=document.getElementById("edit-adm-ig").value.trim();const urlImg=document.getElementById("edit-adm-img").value.trim();if(state.admEditVenueImgData)v.image=state.admEditVenueImgData;else if(urlImg)v.image=urlImg;v.description=document.getElementById("edit-adm-desc").value.trim();saveSingleVenue(v);closeModal();showToast(t("savedToast"));render();}
function adminToggleFeatured(id){const v=state.venues.find(x=>x.id===id);if(!v)return;v.featured=!v.featured;saveSingleVenue(v);showToast(t("savedToast"));render();}
function adminToggleVenueActive(id){const v=state.venues.find(x=>x.id===id);if(!v)return;v.active=v.active===false?true:false;saveSingleVenue(v);showToast(t("savedToast"));render();}
function adminCreateVenue(){const name=document.getElementById("adm-v-name").value.trim(),ownerEmail=document.getElementById("adm-v-email").value.trim().toLowerCase(),city=document.getElementById("adm-v-city").value,district=document.getElementById("adm-v-dist").value.trim(),category=document.getElementById("adm-v-cat").value,whatsapp=formatWhatsAppNumber(document.getElementById("adm-v-wa").value)||"905380942797",instagramUrl=document.getElementById("adm-v-ig").value.trim(),customImg=document.getElementById("adm-v-img").value.trim(),googleMapUrl=document.getElementById("adm-v-map").value.trim(),description=document.getElementById("adm-v-desc").value.trim()||"Seçkin mekanda ayrıcalıklı rezervasyon deneyimi.";if(!name){showToast("Lütfen mekan adı girin.");return;}const defaultImages={restaurant:"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=900&q=80",nail:"https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=900&q=80",beach:"https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80",boat:"https://images.unsplash.com/photo-1567899378494-47b22a2ae96a?auto=format&fit=crop&w=900&q=80"},finalCover=state.admNewVenueImgData||customImg||defaultImages[category];state.admNewVenueImgData="";const newVenue={id:"v_"+Date.now(),name,ownerEmail,category,city,district,whatsapp,instagramUrl,active:true,featured:false,image:finalCover,description,googleMapUrl,googleReviewsUrl:`https://www.google.com/search?q=${encodeURIComponent(name+" "+city+" Yorumlar")}`,ratingSum:5.0,ratingCount:1,defaultSlotQuota:category==="nail"?1:5,slotQuotas:{},closedDates:[],dailySold:{},dailyBooked:{},timeSlots:category==="nail"?["10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00"]:["18:00","19:00","20:00","21:00","22:00","23:00"],areas:["Deniz Manzaralı Teras","Bahçe","VIP İç Mekan"],specialists:["Selin","Damla","Fark Etmez"],capacityTotal:50,menuItems:[{id:"m_"+Date.now(),name:"Standart Rezervasyon / Hizmet",price:"750 TL",stock:20,image:""}]};saveSingleVenue(newVenue);showToast(t("savedToast"));render();}
function adminDeleteVenue(id){state.venues=state.venues.filter(v=>v.id!==id);localStorage.setItem(STORAGE_KEY_VENUES,JSON.stringify(state.venues));if(useFirestore&&db)db.collection("venues").doc(id).delete();state.managedBookings.filter(b=>b.venueId===id).forEach(b=>deleteBookingById(b.id));showToast(t("savedToast"));render();}
function adminPurgeAllPast(){const toRemove=state.managedBookings.filter(b=>b.status==="rejected"||b.rated||isBookingPastOrCompleted(b));if(toRemove.length===0){showToast("Silinecek geçmiş rezervasyon bulunamadı.");return;}toRemove.forEach(b=>deleteBookingById(b.id));showToast(`${toRemove.length} geçmiş kayıt silindi.`);render();}

loadInitialData();render();
</script>
</body>
</html>
